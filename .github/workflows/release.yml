# Strata 三平台构建：Windows / macOS / Linux 一次全出。
# 说明：Tauri 必须在各平台原生构建（macOS 需 Xcode、Linux 需 WebKitGTK），
# Windows 本机交叉编译不出 .app/.dmg/.deb —— 所以三包由 CI 的原生 runner 产出。
# 用法：push 一个 v* 标签，或在 Actions 里手动 Run workflow。
name: Build Strata (3 platforms)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Strata-Windows
            bundles: nsis
          - os: macos-latest
            artifact: Strata-macOS
            bundles: dmg,app
          - os: ubuntu-22.04
            artifact: Strata-Linux
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 7 要求 Node >= 20.19；与本机开发用的 22 对齐，避免 runner 上
          # 因 Node 版本偏低在 npm run build 阶段直接失败。
          node-version: "22"
          cache: "npm"

      - name: Linux system dependencies (WebKitGTK / AppIndicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci
      # mcp/ 是独立 Node 工程（自带 package.json + lock），根目录 npm ci 装不到
      # 它的依赖（@napi-rs/canvas、jpeg-js），vitest 的 MCP 测试会 ERR_MODULE_NOT_FOUND。
      - name: MCP dependencies
        run: npm ci
        working-directory: mcp
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Rust 层也要在三平台各跑一遍：WIA 这类平台专属模块一旦门控漏了，
      # 这里会先于耗时更长的打包阶段把错误暴露出来。
      - name: Rust unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
