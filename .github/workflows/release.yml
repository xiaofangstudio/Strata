# Strata 三平台构建：Windows / macOS / Linux 一次全出。
# 说明：Tauri 必须在各平台原生构建（macOS 需 Xcode、Linux 需 WebKitGTK），
# Windows 本机交叉编译不出 .app/.dmg/.deb —— 所以三包由 CI 的原生 runner 产出。
# 用法：push 一个 v* 标签，或在 Actions 里手动 Run workflow。
name: Build Strata (3 platforms)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Strata-Windows
            bundles: nsis
          - os: macos-latest
            artifact: Strata-macOS
            bundles: dmg,app
          - os: ubuntu-22.04
            artifact: Strata-Linux
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 7 要求 Node >= 20.19；与本机开发用的 22 对齐，避免 runner 上
          # 因 Node 版本偏低在 npm run build 阶段直接失败。
          node-version: "22"
          cache: "npm"

      - name: Linux system dependencies (WebKitGTK / AppIndicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # fonts-noto-cjk：runner 默认无 CJK 字体，缺了它中文渲染测试
          # （renderText「橘猫」栅格化宽度）会拿到兜底字形而失败。
          # fonts-droid-fallback：纯 .ttf 的 CJK 字体，@napi-rs/canvas 老版
          # fontdb 若扫不到 .ttc 集合时由它兜底。
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev fonts-noto-cjk fonts-droid-fallback
          fc-list | grep -iE 'cjk|droid|wqy' | head -3 || true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci
      # mcp/ 是独立 Node 工程（自带 package.json + lock），根目录 npm ci 装不到
      # 它的依赖（@napi-rs/canvas、jpeg-js），vitest 的 MCP 测试会 ERR_MODULE_NOT_FOUND。
      - name: MCP dependencies
        run: npm ci
        working-directory: mcp
      # 诊断：runner 上 GlobalFonts 到底看到了什么字体、量到的宽度是多少。
      - name: Font diagnosis (Linux)
        if: runner.os == 'Linux'
        run: node -e "const {createCanvas,GlobalFonts}=require('./mcp/node_modules/@napi-rs/canvas');console.log('total families:',GlobalFonts.families.length);console.log('CJK-ish:',GlobalFonts.families.map(f=>f.family).filter(f=>/cjk|noto|droid|wenquanyi|yahei|hei|song|kai/i.test(f)).join(' | ')||'(none)');const c=createCanvas(400,120),x=c.getContext('2d');x.font='700 64px \"Noto Sans CJK SC\",\"Droid Sans Fallback\",sans-serif';console.log('measure 64px:',x.measureText('橘猫').width)"
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Rust 层也要在三平台各跑一遍：WIA 这类平台专属模块一旦门控漏了，
      # 这里会先于耗时更长的打包阶段把错误暴露出来。
      - name: Rust unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
